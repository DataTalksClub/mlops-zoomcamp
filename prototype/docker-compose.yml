services:
  mlflow:
    build: ./docker/mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  grafana:
    image: grafana/grafana-oss:11.6.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - postgres

  api:
    build: .
    command: python -m pipeline.api.app
    ports:
      - "9696:9696"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow
    restart: unless-stopped

volumes:
  mlflow_data:
  postgres_data: