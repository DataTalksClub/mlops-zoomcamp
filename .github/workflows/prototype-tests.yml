name: Prototype tests
on:
  pull_request:
    branches: [prototype]
    paths: ['prototype/**']
  push:
    branches: [prototype]
    paths: ['prototype/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q